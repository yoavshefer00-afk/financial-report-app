name: Windows app

# Builds the installer when a version tag is pushed (v1.0.0, ...), and attaches it to a release.
# The page itself (index.html) is updated by a plain push and reaches the installed apps by itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: The built app opens, shows its report and can't reach the network
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/Financial Report.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "the app did not finish" }
          if ($p.ExitCode -ne 0) { throw "smoke test failed: exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: FinancialReport-Setup
          path: dist/FinancialReport-Setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/FinancialReport-Setup.exe --title "${{ github.ref_name }}" --notes "Installer of the financial report app" --latest
